<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Живой мир — 3D стратегия</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #8ab8dc;
    color: white;
}

#game {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
}

.panel {
    position: fixed;
    z-index: 10;
    background: rgba(12, 20, 25, 0.86);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    padding: 14px;
}

#topPanel {
    top: 12px;
    left: 12px;
    min-width: 225px;
}

#topPanel h1 {
    font-size: 21px;
    margin-bottom: 10px;
}

.team {
    margin: 6px 0;
    font-size: 14px;
}

#actions {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

#languageSelect {
    width: 100%;
    padding: 9px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #789;
    background: #253e50;
    color: white;
    font-size: 14px;
    cursor: pointer;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 14px;
    background: #253e50;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
}

button:hover {
    background: #3d6279;
}

button:active {
    transform: scale(0.98);
}

#status {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 12px;
    z-index: 20;
    background: rgba(12, 20, 25, 0.9);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    max-width: 48vw;
    text-align: center;
}

#countdownBanner {
    display: none;
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    background: rgba(18, 28, 38, 0.94);
    border: 2px solid rgba(255, 208, 72, 0.85);
    border-radius: 14px;
    padding: 14px 24px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
}

#countdownBanner.active {
    display: block;
}

#countdownBanner .cd-title {
    font-size: 15px;
    color: #ffd048;
    margin-bottom: 4px;
    font-weight: bold;
}

#countdownBanner .cd-timer {
    font-size: 28px;
    font-weight: bold;
    color: #ffffff;
}

#countdownBanner .cd-sub {
    font-size: 12px;
    color: #cde0f0;
    margin-top: 4px;
}

#victoryModal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(6, 11, 16, 0.72);
    align-items: center;
    justify-content: center;
}

#victoryModal.active {
    display: flex;
}

.victory-card {
    background: rgba(15, 25, 34, 0.96);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    padding: 28px 36px;
    text-align: center;
    max-width: 430px;
    width: 90%;
    box-shadow: 0 18px 45px rgba(0, 0, 0, 0.5);
}

.victory-card h2 {
    font-size: 26px;
    margin-bottom: 10px;
}

.victory-card p {
    font-size: 15px;
    color: #d6e2ec;
    margin-bottom: 20px;
    line-height: 1.45;
}

.victory-card button {
    padding: 12px 22px;
    font-size: 15px;
    background: #2d7a46;
}

.victory-card button:hover {
    background: #3a9959;
}

/* =================================
   МОБИЛЬНАЯ ВЕРСИЯ ANDROID И IOS
================================= */

@media (max-width: 700px) {

    body {
        overflow: hidden;
    }

    #game {
        width: 100vw;
        height: 100dvh;
        touch-action: none;
    }

    #topPanel {
        top: 6px;
        left: 6px;
        min-width: 0;
        width: 190px;
        padding: 8px;
        border-radius: 9px;
    }

    #topPanel h1 {
        font-size: 15px;
        margin-bottom: 5px;
    }

    .team {
        font-size: 11px;
        margin: 4px 0;
    }

    #languageSelect {
        padding: 6px;
        margin: 4px 0;
        font-size: 12px;
    }

    #actions {
        top: 6px;
        right: 6px;
        gap: 5px;
    }

    button {
        padding: 9px 10px;
        font-size: 11px;
        border-radius: 7px;
    }

    #status {
        bottom: 6px;
        width: calc(100% - 12px);
        max-width: none;
        padding: 7px;
        font-size: 11px;
    }

    #countdownBanner {
        top: 115px;
        padding: 10px 16px;
    }

    #countdownBanner .cd-timer {
        font-size: 23px;
    }

    .victory-card {
        padding: 20px;
        width: 92%;
    }

    .victory-card h2 {
        font-size: 22px;
    }
}

/* ==========================================
   АДАПТАЦИЯ ДЛЯ ПК, ПЛАНШЕТОВ И ТЕЛЕФОНОВ
========================================== */

    width: 100%;
    height: 100%;
    min-height: 100%;
}

#game {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    -webkit-user-select: none;

}

button, select {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

.team-panel {
    max-width: calc(50vw - 16px);
}

.team-panel button {
    min-width: 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

@media (max-width: 700px) {
    #topPanel {
        top: max(6px, env(safe-area-inset-top));
        left: max(6px, env(safe-area-inset-left));
        width: min(190px, 48vw);
        max-height: 38vh;
        overflow-y: auto;
    }

    #actions {
        top: max(6px, env(safe-area-inset-top));
        right: max(6px, env(safe-area-inset-right));
        gap: 5px;
    }

    #actions button {
        min-height: 34px;
        padding: 8px 9px;
        font-size: 11px;
        white-space: nowrap;
    }

    .team-panel {
        bottom: max(48px, calc(env(safe-area-inset-bottom) + 42px)) !important;
        width: auto;
        max-width: calc(50vw - 12px);
        grid-template-columns: repeat(3, minmax(36px, 44px)) !important;
        gap: 4px !important;
        padding: 5px !important;
        border-radius: 9px !important;
    }

    .team-panel button {
        width: 44px !important;
        height: 44px !important;
        padding: 3px !important;
        border-radius: 7px !important;
    }

    #status {
        bottom: max(4px, env(safe-area-inset-bottom));
        left: 50%;
        width: calc(100% - 12px);
        max-width: none;
        padding: 6px 8px;
        font-size: 10px;
        line-height: 1.25;
    }

    #countdownBanner {
        top: 42%;
        max-width: calc(100vw - 24px);
    }

    .victory-card {
        max-height: 85dvh;
        overflow-y: auto;
    }
}

@media (max-width: 380px) {
    #topPanel { width: 158px; }
    #topPanel h1 { font-size: 13px; }
    .team { font-size: 10px; }
    #actions button { font-size: 10px; padding: 7px 6px; }
    .team-panel {
        grid-template-columns: repeat(3, 38px) !important;
        gap: 3px !important;
        padding: 4px !important;
    }
    .team-panel button {
        width: 38px !important;
        height: 38px !important;
    }
}

@media (max-height: 520px) and (max-width: 900px) {
    .team-panel {
        bottom: 42px !important;
    }
    #topPanel { max-height: 42vh; }
    #status { font-size: 9px; padding: 4px 6px; }
}

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

// ==========================================
// УЛУЧШЕННАЯ ЗВУКОВАЯ СИСТЕМА (WEB AUDIO API)
// Все звуки создаются внутри игры, отдельные аудиофайлы не нужны.
// ==========================================

class SynthSoundManager {
    constructor() {
        this.ctx = null;
        this.master = null;
        this.lastPlayed = {};
        this.cooldowns = {
            shot: 95,
            explosion: 180,
            tank: 650,
            artillery: 900,
            vehicle: 500,
            tesla: 180
        };
    }

    unlock() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;

            this.ctx = new AudioCtx();
            this.master = this.ctx.createGain();
            this.master.gain.value = 0.72;

            const compressor = this.ctx.createDynamicsCompressor();
            compressor.threshold.value = -18;
            compressor.knee.value = 18;
            compressor.ratio.value = 4;
            compressor.attack.value = 0.004;
            compressor.release.value = 0.22;

            this.master.connect(compressor);
            compressor.connect(this.ctx.destination);
        }

        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
    }

    noiseBuffer(duration) {
        const length = Math.max(1, Math.floor(this.ctx.sampleRate * duration));
        const buffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < length; i++) {
            // Небольшое затухание шума к концу буфера
            const fade = 1 - i / length;
            data[i] = (Math.random() * 2 - 1) * fade;
        }
        return buffer;
    }

    noise(duration, frequency, endFrequency, volume, filterType = 'lowpass', q = 0.8, delay = 0) {
        const t = this.ctx.currentTime + delay;
        const source = this.ctx.createBufferSource();
        source.buffer = this.noiseBuffer(duration);

        const filter = this.ctx.createBiquadFilter();
        filter.type = filterType;
        filter.frequency.setValueAtTime(Math.max(20, frequency), t);
        filter.frequency.exponentialRampToValueAtTime(Math.max(20, endFrequency), t + duration);
        filter.Q.value = q;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.linearRampToValueAtTime(volume, t + 0.006);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);

        source.connect(filter);
        filter.connect(gain);
        gain.connect(this.master);

        source.start(t);
        source.stop(t + duration + 0.02);
    }

    tone(startHz, endHz, duration, volume, wave = 'sine', delay = 0) {
        const t = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = wave;
        osc.frequency.setValueAtTime(Math.max(1, startHz), t);
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, endHz), t + duration);

        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.linearRampToValueAtTime(volume, t + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);

        osc.connect(gain);
        gain.connect(this.master);
        osc.start(t);
        osc.stop(t + duration + 0.02);
    }

    play(type) {
        this.unlock();
        if (!this.ctx || this.ctx.state !== 'running') return;

        const now = performance.now();
        const cooldown = this.cooldowns[type] ?? 150;
        if (now - (this.lastPlayed[type] || 0) < cooldown) return;
        this.lastPlayed[type] = now;

        if (type === 'shot') this.playShot();
        else if (type === 'explosion') this.playExplosion();
        else if (type === 'tank') this.playTank();
        else if (type === 'artillery') this.playArtillery();
        else if (type === 'vehicle') this.playVehicle();
        else if (type === 'tesla') this.playTesla();
    }

    // Короткий резкий выстрел с щелчком и низким ударом
    playShot() {
        const pitch = 0.9 + Math.random() * 0.22;
        this.noise(0.12, 2600 * pitch, 500, 0.20, 'bandpass', 0.9);
        this.noise(0.075, 500, 90, 0.16, 'lowpass', 0.7);
        this.tone(105, 48, 0.095, 0.12, 'triangle');
    }

    // Глубокий взрыв с ударом, треском и длинным хвостом
    playExplosion() {
        const pitch = 0.9 + Math.random() * 0.2;
        this.noise(0.95, 520 * pitch, 42, 0.38, 'lowpass', 0.65);
        this.noise(0.34, 1800, 180, 0.16, 'lowpass', 0.5, 0.012);
        this.tone(82, 27, 0.72, 0.28, 'sine');
        this.noise(0.55, 260, 70, 0.10, 'lowpass', 0.7, 0.16);
    }

    // Тяжёлый танковый выстрел
    playTank() {
        this.noise(0.34, 850, 90, 0.34, 'lowpass', 0.65);
        this.noise(0.11, 1900, 420, 0.20, 'bandpass', 0.8);
        this.tone(105, 34, 0.42, 0.28, 'sine');
        this.noise(0.42, 180, 55, 0.12, 'lowpass', 0.7, 0.08);
    }

    // Артиллерийский залп: низкий выстрел и раскат
    playArtillery() {
        this.tone(72, 25, 0.8, 0.34, 'sine');
        this.noise(0.65, 420, 38, 0.40, 'lowpass', 0.55);
        this.noise(0.22, 1250, 160, 0.19, 'lowpass', 0.7, 0.025);
        this.noise(0.75, 210, 45, 0.13, 'lowpass', 0.6, 0.18);
    }

    // Короткий запуск двигателя техники
    playVehicle() {
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(68 + Math.random() * 18, t);
        osc.frequency.exponentialRampToValueAtTime(125 + Math.random() * 20, t + 0.12);
        osc.frequency.exponentialRampToValueAtTime(58, t + 0.52);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(230, t);

        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.linearRampToValueAtTime(0.13, t + 0.035);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.58);

        this.noise(0.24, 260, 75, 0.08, 'lowpass', 0.7, 0.02);
    }

    // Электрический импульс Tesla
    playTesla() {
        this.noise(0.16, 3200, 500, 0.12, 'bandpass', 2);
        this.tone(520, 95, 0.22, 0.10, 'sawtooth');
        this.tone(90, 180, 0.16, 0.07, 'sine');
    }
}

const sfx = new SynthSoundManager();

// Первый клик/касание разрешает браузеру воспроизводить звук
window.addEventListener('pointerdown', () => sfx.unlock(), { once: true });
window.addEventListener('keydown', () => sfx.unlock(), { once: true });

function makeNoiseCanvas(size, baseRgb, varRange, speckCount, speckRgb) {
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(size, size);
    const d = img.data;

    for (let i = 0; i < d.length; i += 4) {
        const delta = (Math.random() - 0.5) * varRange;
        d[i] = Math.max(0, Math.min(255, baseRgb[0] + delta));
        d[i + 1] = Math.max(0, Math.min(255, baseRgb[1] + delta));
        d[i + 2] = Math.max(0, Math.min(255, baseRgb[2] + delta));
        d[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);

    for (let i = 0; i < speckCount; i++) {
        const x = Math.random() * size;
        const y = Math.random() * size;
        const r = 0.6 + Math.random() * 1.8;
        ctx.fillStyle = speckRgb;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    }

    return c;
}

function createPBRTextureSet(repeatX, repeatY, baseRgb, varRange, speckCount, speckRgb, bumpScale = 0.08) {
    const colorCanvas = makeNoiseCanvas(256, baseRgb, varRange, speckCount, speckRgb);
    const bumpCanvas = makeNoiseCanvas(256, [128, 128, 128], 95, Math.floor(speckCount * 0.6), 'rgba(220,220,220,0.28)');

    const map = new THREE.CanvasTexture(colorCanvas);
    map.colorSpace = THREE.SRGBColorSpace;
    map.wrapS = map.wrapT = THREE.RepeatWrapping;
    map.repeat.set(repeatX, repeatY);

    const bumpMap = new THREE.CanvasTexture(bumpCanvas);
    bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
    bumpMap.repeat.set(repeatX, repeatY);

    return { map, bumpMap, bumpScale };
}

}

function getGroundMovers() {
    const movers = [];
    for (const s of soldiers) if (s.userData.alive) movers.push(s);
    for (const t of tanks) if (t.userData.alive) movers.push(t);
    for (const a of artillery) if (a.userData.alive) movers.push(a);
    return movers;
}

function resolveUnitCollisions(iterations = 2) {
    const movers = getGroundMovers();
    for (let iter = 0; iter < iterations; iter++) {
        for (let i = 0; i < movers.length; i++) {
            const a = movers[i];
            const ra = a.userData.radius || 1;
            for (let j = i + 1; j < movers.length; j++) {
                const b = movers[j];
                const rb = b.userData.radius || 1;
                const minDist = ra + rb;

                let dx = b.position.x - a.position.x;
                let dz = b.position.z - a.position.z;
                let dist = Math.hypot(dx, dz);

                if (dist < minDist) {
                    if (dist < 0.001) {
                        const angle = (i * 1.7 + j * 0.9) % (Math.PI * 2);
                        dx = Math.cos(angle);
                        dz = Math.sin(angle);
                        dist = 0.001;
                    }
                    const overlap = (minDist - dist) * 0.5;
                    const nx = dx / dist;
                    const nz = dz / dist;

                    a.position.x -= nx * overlap;
                    a.position.z -= nz * overlap;
                    b.position.x += nx * overlap;
                    b.position.z += nz * overlap;

                    a.position.y = getEntitySupportY(a.position.x, a.position.z);
                    b.position.y = getEntitySupportY(b.position.x, b.position.z);
                }
            }
        }
    }
}

        battleActive = true;
        document.getElementById('status').textContent =
            `⚔️ Время отсчёта ${finishedStep} вышло — бой продолжается!`;

}

function hasAliveUnits(team) {
    return (
        soldiers.some(s => s.userData.alive && s.userData.team === team) ||
        tanks.some(t => t.userData.alive && t.userData.team === team) ||
        artillery.some(a => a.userData.alive && a.userData.team === team) ||
        flyingTeslas.some(f => f.alive && f.health > 0 && f.team === team)
    );
}

function checkBattleOutcome() {
    if (!battleActive || paused || roundFinished || reinforcementActive) return;

    const blueAlive = hasAliveUnits('blue');
    const redAlive = hasAliveUnits('red');

    if (blueAlive && redAlive) return;

    let wipedTeam = null;
    if (!blueAlive && !redAlive) {
        wipedTeam = wipedTeamWaiting === 'blue' ? 'red' : 'blue';
    } else if (!redAlive) {
        wipedTeam = 'red';
    } else if (!blueAlive) {
        wipedTeam = 'blue';
    }

    const survivingTeam = wipedTeam === 'blue' ? 'red' : 'blue';

    if (countdownStep >= MAX_COUNTDOWNS) {
        showFinalWinner(survivingTeam);
        return;
    }

    startCountdownStep(wipedTeam);
}

function getArmyCount(team) {
    return armyUnits[team].filter(u => !u.released).length;
}

function registerArmyUnit(team, slot, members) {
    const anchor = members[0].mesh ? members[0].mesh.position : members[0].position;
    const unit = {
        team,
        slot,
        x: anchor.x,
        z: anchor.z,
        members,
        released: false
    };
    armyUnits[team].push(unit);

    for (const member of members) {
        if (member.mesh) {
            member.armyUnit = unit;
        } else {
            member.userData.armyUnit = unit;
        }
    }

    resolveUnitCollisions(2);
    if (reinforcementActive) {
        resumeBattleImmediatelyAfterReinforcement(team);
    }
    return unit;
}

function checkDestroyedArmyUnit(member) {
    const unit = member.mesh ? member.armyUnit : member.userData.armyUnit;
    if (!unit || unit.released) return;

    const allDead = unit.members.every(item => {
        if (item.mesh) return item.health <= 0 || !item.alive;
        return item.userData.alive === false || item.userData.health <= 0;
    });

    if (allDead) {
        unit.released = true;
        spawnSlots[unit.team][unit.slot] = false;
        destroyedPositions[unit.team].push({ x: unit.x, z: unit.z, slot: unit.slot });
    }
}

function getChosenSpawnPosition(team) {
    if (getArmyCount(team) >= MAX_ARMY_UNITS) {
        document.getElementById('status').textContent = '⛔ Максимум 12 единиц армии!';
        return null;
    }

    const centerX = team === 'blue' ? -25 : 25;

    if (destroyedPositions[team].length > 0) {
        const saved = destroyedPositions[team].shift();
        const slot = saved.slot ?? 0;
        spawnSlots[team][slot] = true;
        return { x: saved.x, z: saved.z, slot };
    }

    const slot = spawnSlots[team].findIndex(occupied => !occupied);
    if (slot === -1) {
        document.getElementById('status').textContent = '⛔ Все 12 мест заняты!';
        return null;
    }

    spawnSlots[team][slot] = true;
    const col = slot % 3;
    const row = Math.floor(slot / 3);
    return {
        x: centerX + (col - 1) * 8.5,
        z: 32 + row * 8.5,
        slot
    };
}

function updateStats() {
    document.getElementById('losses').textContent = totalLosses;
}

function createArmies() {
    for (const s of soldiers) scene.remove(s);
    for (const t of tanks) scene.remove(t);
    for (const a of artillery) scene.remove(a);
    for (const f of flyingTeslas) scene.remove(f.mesh);

    soldiers.length = 0;
    tanks.length = 0;
    artillery.length = 0;
    flyingTeslas.length = 0;
    armyUnits.blue.length = 0;
    armyUnits.red.length = 0;
    destroyedPositions.blue.length = 0;
    destroyedPositions.red.length = 0;
    spawnSlots.blue.fill(false);
    spawnSlots.red.fill(false);

    countdownStep = 0;
    hideCountdownBanner();
    hideVictoryModal();
    updateRoundHud();

    totalLosses = 0;
    updateStats();

    for (const team of ['blue', 'red']) {
        const mat = team === 'blue' ? materials.blue : materials.red;
        const p1 = getChosenSpawnPosition(team);
        if (p1) {
            const group = [];
            for (let i = 0; i < 5; i++) {
                group.push(createSoldier(team, p1.x + (i % 3) * 2.2 - 2.2, p1.z + Math.floor(i / 3) * 3.2));
            }
            registerArmyUnit(team, p1.slot, group);
        }
        const p2 = getChosenSpawnPosition(team);
        if (p2) {
            const tank = createMilitaryTank(p2.x, p2.z, mat);
            registerArmyUnit(team, p2.slot, [tank]);
        }
    }

    resolveUnitCollisions(3);
}

function distanceBetween(a, b) {
    return Math.hypot(a.position.x - b.position.x, a.position.z - b.position.z);
}

function findNearestEnemy(soldier) {
    let nearest = null;
    let best = Infinity;
    for (const other of soldiers) {
        if (!other.userData.alive || other.userData.team === soldier.userData.team) continue;
        const d = distanceBetween(soldier, other);
        if (d < best) {
            best = d;
            nearest = other;
        }
    }
    return nearest;
}

function findNearestEnemyUnit(tank) {
    let nearest = null;
    let best = Infinity;
    for (const list of [artillery, tanks, soldiers]) {
        for (const enemy of list) {
            if (!enemy.userData.alive || enemy.userData.team === tank.userData.team) continue;
            const d = tank.position.distanceTo(enemy.position);
            if (d < best) {
                best = d;
                nearest = enemy;
            }
        }
    }
    return nearest;
}

function findNearestArtilleryTarget(gun) {
    let nearest = null;
    let best = Infinity;
    for (const list of [tanks, soldiers, artillery]) {
        for (const enemy of list) {
            if (!enemy.userData.alive || enemy.userData.team === gun.userData.team) continue;
            const d = gun.position.distanceTo(enemy.position);
            if (d < best) {
                best = d;
                nearest = enemy;
            }
        }
    }
    return nearest;
}

function createBullet(from, to, team) {
    const color = team === 'blue' ? 0x3399ff : 0xff3333;
    const bullet = new THREE.Group();

    const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.055, 0.09, 0.65, 8),
        new THREE.MeshBasicMaterial({ color })
    );
    body.rotation.x = Math.PI / 2;
    bullet.add(body);

    const tip = new THREE.Mesh(
        new THREE.SphereGeometry(0.09, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    tip.position.z = -0.34;
    bullet.add(tip);

    const startY = from.position.y > 3 ? from.position.y : from.position.y + 1.4;
    bullet.position.set(from.position.x, startY, from.position.z);
    scene.add(bullet);

    const start = bullet.position.clone();
    const end = new THREE.Vector3(to.position.x, to.position.y + 1.4, to.position.z);
    const direction = end.clone().sub(start).normalize();
    bullet.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), direction);

    bullet.userData = {
        direction,
        distance: start.distanceTo(end),
        traveled: 0,
        speed: 40
    };
    bullets.push(bullet);
}

function createDamageEffect(targetObj, smokeY, fireY, list, key) {
    const group = new THREE.Group();
    const smoke = new THREE.Mesh(
        new THREE.SphereGeometry(0.5, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0x333333, transparent: true, opacity: 0.6 })
    );
    smoke.position.y = smokeY;
    group.add(smoke);

    const fire = new THREE.Mesh(
        new THREE.SphereGeometry(0.4, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xff4400, transparent: true, opacity: 0.8 })
    );
    fire.position.y = fireY;
    fire.visible = false;
    group.add(fire);

    targetObj.add(group);
    list.push({ [key]: targetObj, smoke, fire, time: 0 });
}

function updateUnitBar(data, onDamageEffect) {
    if (!data.healthFill) return;
    const pct = Math.max(0, data.health / data.maxHealth);
    const half = data.barWidth / 2;
    data.healthFill.scale.x = pct;
    data.healthFill.position.x = -half * (1 - pct);

    if (pct > 0.6) data.healthFill.material.color.set(0x00ff00);
    else if (pct > 0.3) data.healthFill.material.color.set(0xffff00);
    else data.healthFill.material.color.set(0xff0000);

    if (onDamageEffect) onDamageEffect(pct);
}

function updateTankHealth(tank) {
    const d = tank.userData;
    updateUnitBar(d, pct => {
        if (pct <= 0.6 && !d.effectCreated) {
            createDamageEffect(tank, 4.5, 3.8, tankEffects, 'tank');
            d.effectCreated = true;
        }
        if (pct <= 0.3) {
            const eff = tankEffects.find(item => item.tank === tank);
            if (eff) eff.fire.visible = true;
        }
    });
}

function updateArtilleryHealth(gun) {
    const d = gun.userData;
    updateUnitBar(d, pct => {
        if (pct <= 0.6 && !d.effectCreated) {
            createDamageEffect(gun, 3.5, 2.8, artilleryEffects, 'gun');
            d.effectCreated = true;
        }
        if (pct <= 0.3) {
            const eff = artilleryEffects.find(item => item.gun === gun);
            if (eff) eff.fire.visible = true;
        }
    });
}

function createExplosion(x, y, z) {
    sfx.play('explosion');
    const group = new THREE.Group();
    const fire = new THREE.Mesh(
        new THREE.SphereGeometry(1, 14, 14),
        new THREE.MeshBasicMaterial({ color: 0xff4400, transparent: true, opacity: 0.95 })
    );
    const flash = new THREE.Mesh(
        new THREE.SphereGeometry(0.65, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 1 })
    );
    const smoke = new THREE.Mesh(
        new THREE.SphereGeometry(0.85, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0x333333, transparent: true, opacity: 0.72 })
    );
    smoke.position.y = 0.5;
    group.add(fire, flash, smoke);
    group.position.set(x, y, z);
    scene.add(group);

    group.userData = { time: 0, maxTime: 1.2, fire, flash, smoke };
    explosions.push(group);
}

function createTankDebris(tank) {
    for (let i = 0; i < 10; i++) {
        const piece = new THREE.Mesh(
            new THREE.BoxGeometry(0.3 + Math.random() * 0.4, 0.2 + Math.random() * 0.3, 0.3 + Math.random() * 0.4),
            materials.metal
        );
        piece.position.set(tank.position.x, tank.position.y + 1, tank.position.z);
        piece.castShadow = true;
        scene.add(piece);
        debris.push({
            mesh: piece,
            vx: (Math.random() - 0.5) * 12,
            vy: 4 + Math.random() * 8,
            vz: (Math.random() - 0.5) * 12,
            rotationSpeed: Math.random() * 8,
            life: 3
        });
    }
}

function handleUnitDeath(enemy) {
    if (!enemy.userData.alive) return;
    enemy.userData.alive = false;
    enemy.visible = false;
    totalLosses++;
    createExplosion(enemy.position.x, enemy.position.y + 1.5, enemy.position.z);
    if (tanks.includes(enemy)) createTankDebris(enemy);
    checkDestroyedArmyUnit(enemy);
}

function updateBattle(delta) {
    if (paused || roundFinished) return;

    if (reinforcementActive) {
        updateReinforcementCountdown(delta);
        resolveUnitCollisions(1);
        return;
    }

    if (!battleActive) return;

    for (const soldier of soldiers) {
        if (!soldier.userData.alive) continue;
        const data = soldier.userData;
        data.attackCooldown -= delta;

        const enemy = findNearestEnemy(soldier);
        if (!enemy) continue;

        const dist = distanceBetween(soldier, enemy);
        if (dist > 12) {
            const baseX = data.team === 'blue' ? -25 : 25;
            const insideBase = Math.abs(soldier.position.x - baseX) < 15 && Math.abs(soldier.position.z) < 16.5;
            const targetX = insideBase ? baseX : enemy.position.x;
            const targetZ = insideBase ? 24 : enemy.position.z;

            const dx = targetX - soldier.position.x;
            const dz = targetZ - soldier.position.z;
            const len = Math.hypot(dx, dz);
            if (len > 0.1) {
                const speed = 2.4;
                soldier.position.x += (dx / len) * speed * delta;
                soldier.position.z += (dz / len) * speed * delta;
                soldier.position.y = getEntitySupportY(soldier.position.x, soldier.position.z);
                soldier.rotation.y = Math.atan2(dx, dz);
            }
            data.leftLeg.rotation.x = Math.sin(elapsedTime * 8 + data.phase) * 0.5;
            data.rightLeg.rotation.x = -Math.sin(elapsedTime * 8 + data.phase) * 0.5;
        } else if (data.attackCooldown <= 0) {
            createBullet(soldier, enemy, data.team);
            sfx.play('shot');
            enemy.userData.health -= 20;
            if (tanks.includes(enemy)) updateTankHealth(enemy);
            if (artillery.includes(enemy)) updateArtilleryHealth(enemy);
            data.attackCooldown = 0.8;
            if (enemy.userData.health <= 0) handleUnitDeath(enemy);
        }
    }

    for (const tank of tanks) {
        if (!tank.userData.alive) continue;
        tank.userData.attackCooldown -= delta;
        const enemy = findNearestEnemyUnit(tank);
        if (!enemy) continue;

        const dx = enemy.position.x - tank.position.x;
        const dz = enemy.position.z - tank.position.z;
        tank.rotation.y = Math.atan2(dx, dz) + Math.PI;
        const dist = Math.hypot(dx, dz);

        if (dist > 35) {
            const speed = 4.2;
            tank.position.x += (dx / dist) * speed * delta;
            tank.position.z += (dz / dist) * speed * delta;
            tank.position.y = getEntitySupportY(tank.position.x, tank.position.z);
        } else if (dist < 120 && tank.userData.attackCooldown <= 0) {
            createBullet(tank, enemy, tank.userData.team);
            sfx.play('tank');
            enemy.userData.health -= 100;
            if (tanks.includes(enemy)) updateTankHealth(enemy);
            if (artillery.includes(enemy)) updateArtilleryHealth(enemy);
            tank.userData.attackCooldown = 3;
            if (enemy.userData.health <= 0) handleUnitDeath(enemy);
        }
    }

    for (const gun of artillery) {
        if (!gun.userData.alive) continue;
        gun.userData.attackCooldown -= delta;
        const enemy = findNearestArtilleryTarget(gun);
        if (!enemy) continue;

        const dx = enemy.position.x - gun.position.x;
        const dz = enemy.position.z - gun.position.z;
        gun.rotation.y = Math.atan2(dx, dz) + Math.PI;
        const dist = Math.hypot(dx, dz);

        if (dist < 120 && gun.userData.attackCooldown <= 0) {
            createBullet(gun, enemy, gun.userData.team);
            sfx.play('artillery');
            createExplosion(enemy.position.x, enemy.position.y + 1.5, enemy.position.z);
            enemy.userData.health -= 150;
            if (tanks.includes(enemy)) updateTankHealth(enemy);
            if (artillery.includes(enemy)) updateArtilleryHealth(enemy);
            gun.userData.attackCooldown = 5;
            if (enemy.userData.health <= 0) handleUnitDeath(enemy);
        }
    }

    for (const tesla of flyingTeslas) {
        if (!tesla.alive || tesla.health <= 0) continue;
        tesla.cooldown -= delta;

        let nearestEnemy = null;
        let best = Infinity;
        let enemyIsTesla = false;

        for (const otherTesla of flyingTeslas) {
            if (otherTesla === tesla || !otherTesla.alive || otherTesla.health <= 0 || otherTesla.team === tesla.team) continue;
            const d = tesla.mesh.position.distanceTo(otherTesla.mesh.position);
            if (d < best && d < 120) {
                best = d;
                nearestEnemy = otherTesla;
                enemyIsTesla = true;
            }
        }

        for (const group of [soldiers, tanks, artillery]) {
            for (const enemy of group) {
                if (!enemy.userData.alive || enemy.userData.team === tesla.team) continue;
                const d = tesla.mesh.position.distanceTo(enemy.position);
                if (d < best && d < 120) {
                    best = d;
                    nearestEnemy = enemy;
                    enemyIsTesla = false;
                }
            }
        }

        if (nearestEnemy && tesla.cooldown <= 0) {
            const targetObj = enemyIsTesla ? nearestEnemy.mesh : nearestEnemy;
            createBullet({ position: tesla.mesh.position }, targetObj, tesla.team);
            sfx.play('tesla');

            if (enemyIsTesla) {
                nearestEnemy.health -= 50;
                updateUnitBar(nearestEnemy, null);
                if (nearestEnemy.health <= 0) {
                    nearestEnemy.alive = false;
                    nearestEnemy.mesh.visible = false;
                    totalLosses++;
                    createExplosion(nearestEnemy.mesh.position.x, nearestEnemy.mesh.position.y, nearestEnemy.mesh.position.z);
                    checkDestroyedArmyUnit(nearestEnemy);
                }
            } else {
                nearestEnemy.userData.health -= 50;
                if (tanks.includes(nearestEnemy)) updateTankHealth(nearestEnemy);
                if (artillery.includes(nearestEnemy)) updateArtilleryHealth(nearestEnemy);
                if (nearestEnemy.userData.health <= 0) handleUnitDeath(nearestEnemy);
            }
            tesla.cooldown = 1.2;
        }
    }

    resolveUnitCollisions(2);
    updateStats();
    checkBattleOutcome();
}

        registerArmyUnit(team, p.slot, group);

    makeVehicleButton(panel, icons.truck, color, () => {

        if (!p) return;
        const truck = createMilitaryTruck(p.x, p.z, mat);
        setTimeout(() => scene.remove(truck), 2000);
        const group = [];
        for (let i = 0; i < 5; i++) group.push(createSoldier(team, p.x - 4.4 + i * 2.2, p.z + 5.5));
        for (let i = 0; i < 5; i++) group.push(createSoldier(team, p.x - 4.4 + i * 2.2, p.z + 8.5));
        registerArmyUnit(team, p.slot, group);
    });

    makeVehicleButton(panel, icons.tank, color, () => {
        const p = getChosenSpawnPosition(team);
        if (!p) return;

    makeVehicleButton(panel, icons.artillery, color, () => {

    });

            group.push(createSoldier(team, p.x + (i % 3) * 2.2 - 2.2, p.z + Math.floor(i / 3) * 3.2));

let rotationY = 0;
let cameraDistance = 65;
let cameraHeight = 40;
let dragging = false;
let previousX = 0;
let previousY = 0;

let activePointers = new Map();
canvas.addEventListener('contextmenu', e => e.preventDefault());
let previousPinchDistance = 0;

function getPinchDistance() {
    const points = Array.from(activePointers.values());
    const dx = points[0].x - points[1].x;
    const dy = points[0].y - points[1].y;
    return Math.sqrt(dx * dx + dy * dy);
}

canvas.addEventListener('pointerdown', e => {
    activePointers.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY
    });

    dragging = activePointers.size === 1;

    previousX = e.clientX;
    previousY = e.clientY;

    if (activePointers.size === 2) {
        dragging = false;
        previousPinchDistance = getPinchDistance();
    }

    canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
    if (!activePointers.has(e.pointerId)) return;

    const oldX = activePointers.get(e.pointerId).x;
    const oldY = activePointers.get(e.pointerId).y;

    activePointers.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY
    });

    if (activePointers.size === 1) {
        rotationY -= (e.clientX - oldX) * 0.005;

        cameraHeight = Math.max(
            8,
            Math.min(60, cameraHeight + (e.clientY - oldY) * 0.05)
        );
    }

    if (activePointers.size === 2) {
        const newDistance = getPinchDistance();

        cameraDistance = Math.max(
            18,
            Math.min(150, cameraDistance - (newDistance - previousPinchDistance) * 0.15)
        );

        previousPinchDistance = newDistance;
    }
});

function removePointer(e) {
    activePointers.delete(e.pointerId);
    dragging = false;
    previousPinchDistance = 0;
}

canvas.addEventListener('pointerup', removePointer);
canvas.addEventListener('pointercancel', removePointer);

canvas.addEventListener('wheel', e => {
    cameraDistance = Math.max(
        18,
        Math.min(150, cameraDistance + e.deltaY * 0.025)
    );
}, { passive: true });

function resizeGame() {
    const width = Math.max(1, window.innerWidth);
    const height = Math.max(1, window.innerHeight);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height, false);
    renderer.setPixelRatio(Math.min(
        window.devicePixelRatio || 1,
        maxRenderPixelRatio
    ));
}

window.addEventListener('resize', resizeGame);
window.addEventListener('orientationchange', () => setTimeout(resizeGame, 150));
if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resizeGame);
}

const gameClock = new THREE.Clock();

// ======================================
// TIKFINITY: ПОДАРКИ → ПОДКРЕПЛЕНИЯ
// ======================================

const TF_PARAMS = new URLSearchParams(location.search);
const TF_URL = `ws://${TF_PARAMS.get('tf') || 'localhost'}:21213/`;

const GIFT_TEAM = {
    'rose': 'blue',
    'роза': 'blue',
    'tiktok': 'red'
};

const GIFT_KIND = {
    'rose': 'soldiers',
    'роза': 'soldiers',
    'tesla': 'tesla',
    'артиллерия': 'artillery',
    'artillery': 'artillery',
    'jeep': 'jeep',
    'джип': 'jeep',
    'truck': 'truck',
    'грузовик': 'truck',
    'tank': 'tank',
    'танк': 'tank'
};
const GIFT_TIERS = [
    { min: 1000, kind: 'tesla',     icon: '⚡' },
    { min: 300,  kind: 'tank',      icon: '🛡️' },
    { min: 100,  kind: 'artillery', icon: '💥' },
    { min: 30,   kind: 'truck',     icon: '🚚' },
    { min: 5,    kind: 'jeep',      icon: '🚙' },
    { min: 0,    kind: 'soldiers',  icon: '🪖' }
];

const MAX_PER_GIFT = 3;
const MAX_QUEUE = 40;
const QUEUE_TTL_MS = 60000;
const SPAWN_EVERY_MS = 350;

let tikfinitySocket = null;
let tikfinityConnected = false;

function spawnReinforcement(team, kind) {
    const mat = team === 'blue' ? materials.blue : materials.red;
    const p = getChosenSpawnPosition(team);
    if (!p) return false;
    let group = [];

    if (kind === 'jeep') {
        const jeep = createMilitaryJeep(p.x, p.z, mat);
        setTimeout(() => scene.remove(jeep), 2000);
        for (let i = 0; i < 4; i++) group.push(createSoldier(team, p.x - 3.3 + i * 2.2, p.z + 5.5));
        for (let i = 0; i < 3; i++) group.push(createSoldier(team, p.x - 2.2 + i * 2.2, p.z + 8.5));
    } else if (kind === 'truck') {
        const truck = createMilitaryTruck(p.x, p.z, mat);
        setTimeout(() => scene.remove(truck), 2000);
        for (let i = 0; i < 5; i++) group.push(createSoldier(team, p.x - 4.4 + i * 2.2, p.z + 5.5));
        for (let i = 0; i < 5; i++) group.push(createSoldier(team, p.x - 4.4 + i * 2.2, p.z + 8.5));
    } else if (kind === 'tank') {
        group = [createMilitaryTank(p.x, p.z, mat)];
    } else if (kind === 'artillery') {
        group = [createArtillery(p.x, p.z, mat)];
    } else if (kind === 'tesla') {
        group = [createFlyingTesla(p.x, p.z, team)];
    } else {
        for (let i = 0; i < 5; i++) {
            group.push(createSoldier(team, p.x + (i % 3) * 2.2 - 2.2, p.z + Math.floor(i / 3) * 3.2));
        }
    }

    registerArmyUnit(team, p.slot, group);
    return true;
}

const giftQueue = [];

function enqueueGift(team, tier, who, label) {
    if (giftQueue.length >= MAX_QUEUE) return;
    giftQueue.push({ team, kind: tier.kind, icon: tier.icon, who, label, expires: Date.now() + QUEUE_TTL_MS });
}

setInterval(() => {
    if (paused || roundFinished) return;

    const now = Date.now();
    for (let i = giftQueue.length - 1; i >= 0; i--) {
        if (giftQueue[i].expires < now) giftQueue.splice(i, 1);
    }

    const i = giftQueue.findIndex(g => getArmyCount(g.team) < MAX_ARMY_UNITS);
    if (i === -1) return;

    const g = giftQueue[i];
    if (spawnReinforcement(g.team, g.kind)) {
        giftQueue.splice(i, 1);
        document.getElementById('status').textContent =
            `🎁 ${g.who}: ${g.label} → ${g.team === 'blue' ? '🔵' : '🔴'} ${g.icon}`;
    }
}, SPAWN_EVERY_MS);

function teamStrength(team) {
    let s = 0;
    for (const list of [soldiers, tanks, artillery]) {
        for (const u of list) if (u.userData.alive && u.userData.team === team) s += u.userData.health;
    }
    for (const f of flyingTeslas) if (f.alive && f.team === team) s += f.health;
    return s;
}

function weakerTeam() {
    const b = teamStrength('blue');
    const r = teamStrength('red');
    if (b === r) return Math.random() < 0.5 ? 'blue' : 'red';
    return b < r ? 'blue' : 'red';
}

function handleGift(p) {
    if (p.giftType === 1 && p.repeatEnd === false) return;

    const name = String(p.giftName || '').trim();
    const coins = Number(p.diamondCount ?? p.coins ?? 1) || 1;
    const repeat = Math.min(MAX_PER_GIFT, Math.max(1, Number(p.repeatCount) || 1));
    
    const giftKey = name.toLowerCase().replace(/[^a-zа-яё]/g, '');
    const team = GIFT_TEAM[giftKey] || weakerTeam();
    const giftKind = GIFT_KIND[giftKey];
    const tier = giftKind
        ? GIFT_TIERS.find(t => t.kind === giftKind)
        : GIFT_TIERS.find(t => coins >= t.min);
    const who = p.nickname || p.uniqueId || '?';

    for (let i = 0; i < repeat; i++) enqueueGift(team, tier, who, name || `${coins}🪙`);
}

const tfInfo = document.createElement('div');
tfInfo.className = 'team';
tfInfo.style.cssText = 'font-size:11px;line-height:1.5;';
document.getElementById('topPanel').appendChild(tfInfo);

function renderTfInfo() {
    const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
    const names = team => Object.keys(GIFT_TEAM).filter(k => GIFT_TEAM[k] === team).map(cap).join(', ');
    const tiers = [...GIFT_TIERS].reverse().map(t => `${t.icon}${t.min || 1}`).join(' ');
    tfInfo.innerHTML =
        `${tikfinityConnected ? '🟢' : '🔴'} TikFinity<br>` +
        `🔵 ${names('blue')}<br>🔴 ${names('red')}<br>${tiers}`;
}
renderTfInfo();

function connectTikFinity() {
    try {
        tikfinitySocket = new WebSocket(TF_URL);
    } catch (error) {
        console.log('TikFinity: не удалось создать соединение', error);
        setTimeout(connectTikFinity, 3000);
        return;
    }

    tikfinitySocket.onopen = () => {
        tikfinityConnected = true;
        renderTfInfo();
        console.log('TikFinity подключен!');
    };

    tikfinitySocket.onmessage = event => {
        try {
            const msg = JSON.parse(event.data);
            const type = msg.event || msg.type;
            const payload = (msg.data && typeof msg.data === 'object') ? msg.data : msg;
            if (type === 'gift') {
                console.log('TikFinity подарок:', payload);
                handleGift(payload);
            }
        } catch (error) {
            console.log('Ошибка обработки события:', error);
        }
    };

    tikfinitySocket.onclose = () => {
        tikfinityConnected = false;
        renderTfInfo();
        setTimeout(connectTikFinity, 3000);
    };

    tikfinitySocket.onerror = error => console.log('Ошибка TikFinity:', error);
}

connectTikFinity();

window.simulateGift = (giftName, diamondCount = 1, repeatCount = 1) =>
    handleGift({ giftName, diamondCount, repeatCount, nickname: 'test' });

if (TF_PARAMS.has('test')) {
    const box = document.createElement('div');
    box.style.cssText =
        'position:fixed;left:6px;top:50%;transform:translateY(-50%);z-index:15;' +
        'display:grid;grid-template-columns:repeat(2,40px);gap:3px;';

        for (const team of ['blue', 'red']) {

}

function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(gameClock.getDelta(), 0.05);

    if (battleActive && !paused && !roundFinished && !reinforcementActive) {
        elapsedTime += delta;
    }

    const min = String(Math.floor(elapsedTime / 60)).padStart(2, '0');
    const sec = String(Math.floor(elapsedTime % 60)).padStart(2, '0');
    document.getElementById('clock').textContent = `${min}:${sec}`;

    updateBattle(delta);

    searchBeams.forEach((beam, idx) => {
        beam.rotation.y = Math.sin(Date.now() * 0.0005 + idx * Math.PI / 2) * 0.8;
    });

    for (const unitList of [tanks, artillery]) {
        for (const unit of unitList) {
            if (!unit.userData.alive || !unit.userData.healthBar) continue;
            unit.userData.healthBar.quaternion.copy(unit.quaternion).invert().multiply(camera.quaternion);
        }
    }

    for (const tesla of flyingTeslas) {
        if (!tesla.alive || tesla.health <= 0) continue;
        tesla.mesh.position.y = tesla.baseY + Math.sin(elapsedTime * 2.5) * 0.4;
        tesla.healthBar.quaternion.copy(tesla.mesh.quaternion).invert().multiply(camera.quaternion);
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        const step = b.userData.speed * delta;
        b.position.addScaledVector(b.userData.direction, step);
        b.userData.traveled += step;
        if (b.userData.traveled >= b.userData.distance) {
            scene.remove(b);
            bullets.splice(i, 1);
        }
    }

    for (const eff of tankEffects) {
        if (!eff.tank.userData.alive) continue;
        eff.time += delta;
        eff.smoke.position.y = 4.5 + Math.sin(eff.time * 3) * 0.3;
        if (eff.fire.visible) eff.fire.scale.setScalar(0.8 + Math.sin(eff.time * 10) * 0.3);
    }

    for (const eff of artilleryEffects) {
        if (!eff.gun.userData.alive) continue;
        eff.time += delta;
        eff.smoke.position.y = 3.5 + Math.sin(eff.time * 3) * 0.3;
        if (eff.fire.visible) eff.fire.scale.setScalar(0.8 + Math.sin(eff.time * 10) * 0.3);
    }

    for (let i = explosions.length - 1; i >= 0; i--) {
        const exp = explosions[i];
        const d = exp.userData;
        d.time += delta;
        const p = Math.min(d.time / d.maxTime, 1);
        d.fire.scale.setScalar(1 + p * 3);
        d.fire.material.opacity = 0.95 * (1 - p);
        d.flash.scale.setScalar(1 + p * 2);
        d.flash.material.opacity = 1 - p;
        d.smoke.position.y = 0.5 + p * 3;
        d.smoke.scale.setScalar(1 + p * 2);
        d.smoke.material.opacity = 0.7 * (1 - p);

        if (p >= 1) {
            scene.remove(exp);
            exp.traverse(obj => {
                if (obj.isMesh) {
                    obj.geometry.dispose();
                    obj.material.dispose();
                }
            });
            explosions.splice(i, 1);
        }
    }

    for (let i = debris.length - 1; i >= 0; i--) {
        const item = debris[i];
        const piece = item.mesh;
        piece.position.x += item.vx * delta;
        piece.position.z += item.vz * delta;
        item.vy -= 15 * delta;
        piece.position.y += item.vy * delta;
        piece.rotation.x += item.rotationSpeed * delta;
        piece.rotation.y += item.rotationSpeed * delta;

        const floorY = getEntitySupportY(piece.position.x, piece.position.z) + 0.2;
        if (piece.position.y <= floorY) {
            piece.position.y = floorY;
            item.vy = item.vx = item.vz = 0;
        }
        item.life -= delta;
        if (item.life <= 0) {
            scene.remove(piece);
            piece.geometry.dispose();
            piece.material.dispose();
            debris.splice(i, 1);
        }
    }

    for (const gate of gates) {
        const d = gate.userData;
        let shouldOpen = false;

        for (const s of soldiers) {
            if (s.userData.alive && s.userData.team === d.team &&
                Math.hypot(s.position.x - gate.position.x, s.position.z - gate.position.z) < 12) {
                shouldOpen = true;
                break;
            }
        }
        if (!shouldOpen) {
            for (const v of vehicles) {
                if (v.userData.team === d.team &&
                    Math.hypot(v.position.x - gate.position.x, v.position.z - gate.position.z) < 22) {
                    shouldOpen = true;
                    break;
                }
            }
        }
        if (!shouldOpen) {
            for (const t of tanks) {
                if (t.userData.alive && t.userData.team === d.team &&
                    Math.hypot(t.position.x - gate.position.x, t.position.z - gate.position.z) < 22) {
                    shouldOpen = true;
                    break;
                }
            }
        }

        const target = shouldOpen ? 1 : 0;
        d.openAmount += (target - d.openAmount) * Math.min(delta * 3, 1);
        d.leftGate.position.x = -1.75 - 5.5 * d.openAmount;
        d.rightGate.position.x = 1.75 + 5.5 * d.openAmount;
    }

    camera.position.x = Math.sin(rotationY) * cameraDistance;
    camera.position.z = Math.cos(rotationY) * cameraDistance;
    camera.position.y = cameraHeight;
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
}

try {
    createArmies();
    camera.position.set(0, cameraHeight, cameraDistance);
    camera.lookAt(0, 0, 0);
    animate();
    document.getElementById('status').textContent = '✅ Мир загружен! Нажми «Начать битву».';
} catch (error) {
    console.error(error);
    document.getElementById('status').textContent = 'Ошибка запуска. Открой консоль (F12).';
}
